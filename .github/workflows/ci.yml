name: 仓库自检

# 说明：这里**不做编译**。插件要对着 Survivalcraft 服务端核心 DLL 编译，那是商业游戏的
# 文件，不能进公开仓库，云端 runner 拿不到。所以 CI 只跑不需要核心 DLL 的检查，
# 真正的构建 + Release 附件上传走本机的 .buildtools/publish-release.py。
#
# 检查内容见 .buildtools/check-sources.py：
#   1. 逐字字符串引号配对（漏写一个引号会一次报几百个错且位置全偏，踩过）
#   2. .gitignore 白名单是否覆盖了每个待发布插件（忘了放行 = 静默少发布一个）
#   3. 版本库里有没有混入令牌 / 服务端目录 / 取证报告这类敏感文件
#   4. 每个待发布插件是否都带 README
#   5. Scforge 发布配方是否与 Assets 一一对应、slug 是否唯一（缺配方 = 平台静默少一个资源）

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 源码与仓库自检
        run: python3 .buildtools/check-sources.py

  # 打 tag 后把 Release 附件同步到 SCForge 资源平台。
  #
  # ⚠️ 前置：仓库 Secrets 里要有 SCFORGE_TOKEN（scf_ 开头的 API Key，publish 作用域）。
  # 没配的话这一步会优雅跳过并打一行提示，不会让 CI 变红 —— 这样"只发 GitHub 不发平台"
  # 的仓库状态也能正常走 CI。
  #
  # 取文件走 --from-url：runner 上没有编译产物（编不出来，见文首说明），
  # 只能从刚发布的 Release 附件下载。脚本内部会优先用 gh-proxy 加速前缀，失败自动退回直连。
  #
  # ⚠️ 打 tag 会同时触发本作业与本机的 Release 创建，两条流程并行：
  # CI 常常跑得比"Release 建好 + 附件传完"更快，此时取附件会 404。
  # 所以先轮询等 Release 出现，再开始上传（脚本内另有重试兜底）。
  publish-scforge:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 等待 GitHub Release 就绪
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          for i in $(seq 1 30); do
            assets=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$url" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('assets') or []))" 2>/dev/null || echo 0)
            if [ "$assets" -ge 9 ]; then
              echo "Release 已就绪，附件 $assets 个。"
              exit 0
            fi
            echo "等待 Release 附件（当前 $assets 个）... $i/30"
            sleep 10
          done
          echo "::warning::等待超时，仍尝试上传（脚本内部还有重试）。"

      - name: 上传到 SCForge
        env:
          SCFORGE_TOKEN: ${{ secrets.SCFORGE_TOKEN }}
        run: |
          if [ -z "$SCFORGE_TOKEN" ]; then
            echo "::warning::未配置 SCFORGE_TOKEN，跳过 SCForge 上传。"
            echo "要自动发平台，请在仓库 Settings → Secrets and variables → Actions 里加上它。"
            exit 0
          fi
          python3 .buildtools/publish-to-scforge.py "$GITHUB_REF_NAME" --from-url
